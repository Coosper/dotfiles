# ═════════════════════════════════════ #
#           LOOK & FEEL                 #
# ═════════════════════════════════════ #
# Borders, gaps, shadows, animations

general {
    gaps_in           = 6
    gaps_out          = 14
    border_size       = 2
    col.active_border = $sapphire $mauve 45deg
    col.inactive_border = rgba(363a4f88)
    resize_on_border  = true
    allow_tearing     = false
    layout            = dwindle
}

decoration {
    rounding          = 12
    active_opacity    = 1.0
    inactive_opacity  = 0.92
    dim_inactive      = true
    dim_strength      = 0.2

    shadow {
        enabled        = true
        range          = 20
        render_power   = 2
        offset         = 0, 4
        color          = rgba($crustAlphacc)
        color_inactive = rgba($crustAlpha55)
    }

    blur {
        enabled           = true
        size              = 6
        passes            = 3
        new_optimizations = true
        noise             = 0.015
        contrast          = 0.9
        brightness        = 0.85
        ignore_opacity    = true
        popups            = true
        vibrancy          = 0.22
        vibrancy_darkness = 0.5
    }
}

animations {
    enabled = 1

    # Curves
    bezier = snap,     0.16, 1,    0.3,  1     # fast in, instant settle
    bezier = flee,     0.55, 0,    1,    1     # aggressive ease-out for exits
    bezier = cruise,   0.22, 1,    0.4,  1     # quick move, smooth land
    bezier = material, 0.3,  0,    0.1,  1     # snappy material feel
    bezier = spring,   0.2,  1.1,  0.4,  1     # slight pop, tight overshoot
    bezier = weight,   0.0,  0.9,  0.15, 1     # punchy workspace slide
    bezier = cozy,     0.28, 1.18, 0.5,  1     # small overshoot, lands fast

    # Windows
    animation = windowsIn,   1, 3, cozy,   popin 75%
    animation = windowsOut,  1, 2, flee,   popin 75%
    animation = windowsMove, 1, 3, cruise, slide

    # Fades
    animation = fadeIn,     1, 3, material
    animation = fadeOut,    1, 2, flee
    animation = fadeDim,    1, 4, material
    animation = fadeSwitch, 1, 3, material
    animation = fadeShadow, 1, 3, material

    # Workspaces
    animation = workspaces,       1, 4, weight, slidefade 20%
    animation = specialWorkspace, 1, 3, spring, slidefade 20%

    # Layers (e.g. launchers, bars)
    animation = layersIn,      1, 3, spring, slide
    animation = layersOut,     1, 2, flee,   slide
    animation = fadeLayersIn,  1, 3, material
    animation = fadeLayersOut, 1, 2, flee

    # Border gradient rotation
    animation = border, 1, 8, material
}

dwindle {
    preserve_split = true
    smart_split    = true       # split direction follows cursor position
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = false
    disable_hyprland_logo   = true
    animate_manual_resizes  = true   # window resize feels weighty
    animate_mouse_windowdragging = true
}

xwayland {
    force_zero_scaling = true
}